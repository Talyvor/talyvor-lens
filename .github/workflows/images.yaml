name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      # migrations are //go:embed-ded into the lens binary — without this
      # path a migrations-only merge never reaches :latest and the image's
      # embedded migration set silently lags the repo (#125 aftermath).
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/images.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Written out, in lowercase. Since 12 Oct 2026 this repository belongs to the GitHub organisation
  # whose login is "Talyvor" (capital T), and Docker refuses an image name with a capital letter, so
  # github.repository_owner can no longer be used here. cmd/lens/chart_image_reach_test.go (2) keeps
  # this literal and the chart's image.repository in agreement.
  OWNER: talyvor

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # Stamp the binary with the SAME sha the image is tagged with below, so
          # `lens version` (and /healthz, and /status) can be compared DIRECTLY
          # against the registry tag. Verifying a deployment stops being a manual
          # cross-check and becomes one command against the running service.
          build-args: |
            LENS_VERSION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/talyvor-lens:latest
            ghcr.io/${{ env.OWNER }}/talyvor-lens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # B28.255: each platform's image carries its SBOM (SPDX, made by syft) in the registry, next to
          # the image. The scanner is pinned by digest (docker/buildkit-syft-scanner 1.12.1), so a new
          # release cannot change the SBOM without a commit. Read it with
          #   docker buildx imagetools inspect ghcr.io/talyvor/talyvor-lens:<sha> --format '{{ json .SBOM }}'
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
      # Read the SBOMs back from the registry: a push that attached none, or an empty one, fails here.
      # The same SBOMs are kept on the run as the lens-image-sbom artifact.
      - name: The pushed image carries its SBOM
        run: |
          mkdir -p sbom
          docker buildx imagetools inspect "ghcr.io/${OWNER}/talyvor-lens:${GITHUB_SHA}" --format '{{ json .SBOM }}' > sbom/all.json
          for p in linux/amd64 linux/arm64; do
            f="sbom/talyvor-lens-${GITHUB_SHA}-${p#linux/}.spdx.json"
            jq --arg p "$p" '.[$p].SPDX' sbom/all.json > "$f"
            n="$(jq '.packages | length' "$f")"
            jq -e '[.packages[].name] | index("github.com/jackc/pgx/v5")' "$f" > /dev/null || {
              echo "::error::the $p image has no SBOM attached, or its SBOM does not list the Go modules in the lens binary ($n packages)"
              exit 1
            }
            echo "$p: SBOM attached, $n packages"
          done
          rm sbom/all.json
      - name: Keep the SBOMs on the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lens-image-sbom
          path: sbom/
