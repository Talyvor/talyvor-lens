name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      # migrations are //go:embed-ded into the lens binary — without this
      # path a migrations-only merge never reaches :latest and the image's
      # embedded migration set silently lags the repo (#125 aftermath).
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/images.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Written out, in lowercase. Since 12 Oct 2026 this repository belongs to the GitHub organisation
  # whose login is "Talyvor" (capital T), and Docker refuses an image name with a capital letter, so
  # github.repository_owner can no longer be used here. cmd/lens/chart_image_reach_test.go (2) keeps
  # this literal and the chart's image.repository in agreement.
  OWNER: talyvor

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # Stamp the binary with the SAME sha the image is tagged with below, so
          # `lens version` (and /healthz, and /status) can be compared DIRECTLY
          # against the registry tag. Verifying a deployment stops being a manual
          # cross-check and becomes one command against the running service.
          build-args: |
            LENS_VERSION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/talyvor-lens:latest
            ghcr.io/${{ env.OWNER }}/talyvor-lens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
