name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # B39.1: production sits behind PgBouncer (LENS_DB_PGBOUNCER=true), where pgx speaks the SIMPLE protocol and a
    # []byte bound to a jsonb column goes out as bytea (22P02, #133). That bug reached production four times because
    # the real-PG tests only ran on the extended protocol, so every one now runs on both, in parallel legs. pgx reads
    # default_query_exec_mode from the DSN, so every pool and connection a test opens from it gets the leg's mode.
    strategy:
      fail-fast: false
      matrix:
        exec_mode: [cache_statement, simple_protocol]
    name: test (${{ matrix.exec_mode }})
    # ⚠ DEFINED ONCE, AT JOB LEVEL, AND THAT IS LOAD-BEARING. The preflight step
    # below and the `go test` step must use the SAME value: if each defined its
    # own, the preflight could pass against one DSN while every real-PG test
    # skipped on another, which is the failure it exists to catch.
    env:
      LENS_TEST_DATABASE_URL: postgres://postgres:lens_test@localhost:5432/lens_test?sslmode=disable&default_query_exec_mode=${{ matrix.exec_mode }}
      # B26.1: the synthetic reset's scale test runs on a real Redis here (a miniredis without it).
      LENS_TEST_REDIS_URL: redis://localhost:6379/0
    # Throwaway Postgres for two standing regression guards:
    # (1) the LENS_TEST_DATABASE_URL-gated integration tests (pool-mint-cap
    #     exactness + dbmigrate runner) — they create their own schema/fixtures
    #     and touch disjoint tables, no migration step needed;
    # (2) the real-migration guard below, which applies migrations/*.sql via
    #     `lens migrate` into its OWN database (lens_migrate_check — the gated
    #     tests DROP/CREATE their fixture tables, so they must not share a DB
    #     with a fully-migrated schema) and then re-runs to prove the chain is
    #     version-tracked idempotent. pgvector image, not plain postgres:
    #     0001_init.sql needs CREATE EXTENSION vector — same image production
    #     compose uses.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lens_test
          POSTGRES_DB: lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      # A `finally` DOES NOT RUN ON SIGTERM, and 16 of this repo's control scripts mutate a
      # tracked file and restore it in one. NONE installed a handler before this step, and
      # talyvor-lens was the LAST repo in the estate with no guard for it at all.
      #
      # ⚠ ORG-LEVEL CLASS GUARD, NOT A LENS GUARD. The hazard was measured in talyvor-suite
      # (W1.7, 78c69c8): a 2-minute command timeout killed a control mid-mutation and left
      # deploy/decision-expiry.sh reading `if true; then` WHERE A GATE HAD BEEN, with a green suite
      # and a `git status` showing only files the session had edited on purpose. Reproduced on
      # demand in suite 5de27e3, talyvor-docs ffe9063 (go.mod), talyvor-track 5f01947 (go.mod) and
      # here.
      #
      # ⚠⚠ DETECTION IS `ast`, NEVER GREP, AND THIS REPO IS THE PROOF THAT A GREP IS WRONG IN BOTH
      # DIRECTIONS. `grep -l finally:` counts 15 here and the real population is 16 — a restore
      # reached through a `with`/__exit__ has no `finally:` token near it at all. Everywhere else
      # the grep OVER-counts by about a third (suite 58 vs 41, docs 60 vs 43, track 90 vs 61).
      #
      # The guard resolves four restore idioms and carries a floor PER DETECTOR: a single floor
      # over the union is satisfied by either detector alone, which would let the wide half revert
      # to silence with the guard green.
      - name: control scripts must restore on SIGTERM, not only in a finally
        run: python3 scripts/check-restore-signal-handlers.py --ci
      # ⚠ THE OTHER END A CONTROL SCRIPT ROTS FROM. The step above proves these scripts RESTORE.
      # Nothing proved they still ANCHOR. Measured (W6.45): w631's Y4/Y5 arms sat
      # `ANCHOR-FAILED: anchor appears 0 times` for an unknown period after #526/#528 replaced a
      # regex census with a go/parser walk and deleted the vars they mutated — the campaign printed
      # `4/6` the whole time, and `4/6` reads like a SCORE, not like an instrument reporting it
      # could not run. The sibling repos hit the mirror direction: docs `2 times`, track `3 times`.
      #
      # ⚠⚠ IT READS 6 OF 35 SCRIPTS AND SAYS SO ON EVERY RUN, GREEN ONES INCLUDED. Only the
      # w626–w631 convention carries a resolvable path column in its control table; the other 29
      # keep the target in a module constant used elsewhere, and 203 of 251 candidate rows are
      # unreadable for that reason. A green here is a claim about those six, not about the repo.
      # talyvor-docs shipped a real-PG guard covering 36 of 78 tests while a pass implied all 78,
      # and removed it — see scripts/check-realpg-dsn.sh. Partial is fine; partial-reading-as-total
      # is the defect. Floors are per dimension, because a union floor is satisfied by either half.
      #
      # Pure string counting: no mutation, no `go test`, no database.
      - name: control anchors must still resolve (the census, with its own denominator)
        run: python3 scripts/check-control-anchors.py --ci
      # B37.6: a floating tag changes under the server at the next pull, with no review.
      - name: every compose image is pinned by tag and digest
        run: python3 scripts/check-image-digests.py
      - name: go vet
        run: go vet ./...
      # Real-migration regression guard: the ONLY place migrations/*.sql are
      # executed in automation (the gated tests build their own fixtures, the
      # dbmigrate integration test uses synthetic MapFS files). Run 1 applies
      # 0001→0049 from a clean database; run 2 must be a version-tracked
      # no-op. This is the guard that would have caught the 0037
      # DROP-INDEX-CONCURRENTLY-on-partitioned-index deploy blocker (#125)
      # and the 0001 re-run failure (#127) at PR time.
      - name: real migrations apply + re-run no-op
        env:
          PGPASSWORD: lens_test
          LENS_DATABASE_URL: postgres://postgres:lens_test@localhost:5432/lens_migrate_check?sslmode=disable
        run: |
          psql -h localhost -U postgres -d lens_test -c 'CREATE DATABASE lens_migrate_check'
          go run ./cmd/lens migrate
          go run ./cmd/lens migrate 2>&1 | tee /tmp/migrate-rerun.log
          grep -q "already up to date" /tmp/migrate-rerun.log
          want="$(ls migrations/*.sql | wc -l | tr -d ' ')"
          got="$(psql -h localhost -U postgres -d lens_migrate_check -tAc 'SELECT count(*) FROM schema_migrations')"
          echo "schema_migrations: got=$got want=$want"
          test "$got" = "$want"
      # Every real-PG test here is gated on LENS_TEST_DATABASE_URL and t.Skip()s
      # without it — 132 skip sites across 151 files, no shared helper — and
      # `go test` EXITS 0 ON A SKIP. Without this step, a Postgres service that
      # failed to come up would delete the entire real-PG suite and leave CI
      # green. See scripts/check-realpg-dsn.sh for what it does and does not
      # claim, and for why it is not the by-name variant talyvor-docs removed.
      - name: real-PG preflight (the DSN the tests will use must be reachable)
        # psql refuses pgx's default_query_exec_mode parameter; the host and database it checks are the same.
        run: LENS_TEST_DATABASE_URL="${LENS_TEST_DATABASE_URL%%&default_query_exec_mode=*}" ./scripts/check-realpg-dsn.sh
      - name: go test
        # -p 1 serialises package test binaries so they never share the single lens_test DB concurrently.
        # Without it, packages run in parallel against one DB and destructive resets collide intermittently
        # — e.g. internal/proxy TestAgentAllocator's `TRUNCATE ... lxc_ledger` (blocked by the U14
        # append-only trigger once a concurrent package has migrated it) and internal/api
        # TestSpendByRequest's token_events seed — producing false reds on unrelated PRs (this caused #276's
        # scary-but-harmless red). Serialising is the systemic fix; correctness over a little wall-clock.
        # -timeout is per package: cmd/lens alone takes 108–120s under -race on a normal runner, so 120s
        # timed it out on three consecutive attempts at 29221e6 with no test at fault. By 19 Oct 2026 it took
        # 227–299s, and 300s timed it out on three of four runs with no test at fault (B40.5), so 600s.
        run: go test -timeout 600s -race -count=1 -p 1 ./...
      # B35.2 — one agent's 60 simultaneous requests, and two agents' at once, all hold and settle with no
      # deadlock: five runs in a row, as the item's DONE asks, because one green run of a race proves little.
      - name: B35.2 simultaneous agent requests, five runs in a row
        run: go test -timeout 300s -race -count=5 -run '^TestB352_' ./internal/economy/

  # B27.35 — Tare phase 2a against the REAL weights: the pure-Go port reproduces onnxruntime's logits
  # (golden_test.go), and on real payloads the measured reduction and the known-answer scenarios hold
  # (measured_test.go). The weights are 279 MB and not in git, so this fetches the SAME bytes the
  # Dockerfile's kompress stage puts in the image — revision and sha256s read from the Dockerfile, the
  # one place they are written. TARE_MODEL_REQUIRED=1 makes a missing model a failure; in the test job
  # above those tests skip, because the weights are not there. No -race: the race detector makes a
  # forward pass minutes long, and the reducer's concurrency is covered there by the weight-free tests.
  tare-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - name: fetch kompress-small at the Dockerfile's pinned revision
        run: |
          rev="$(sed -n 's/^ARG KOMPRESS_REV=//p' Dockerfile)"
          test -n "$rev"
          grep -oE '[0-9a-f]{64} [a-z_.]+' Dockerfile | sed 's/ /  /' > /tmp/kompress.sha256
          test "$(wc -l < /tmp/kompress.sha256)" -eq 2
          mkdir -p /tmp/kompress-small && cd /tmp/kompress-small
          for f in model.safetensors tokenizer.json; do
            curl -fsSL --retry 3 -o "$f" "https://huggingface.co/chopratejas/kompress-small/resolve/$rev/$f"
          done
          sha256sum -c /tmp/kompress.sha256
      - name: Tare phase 2a model tests (real weights)
        env:
          LENS_TARE_MODEL_DIR: /tmp/kompress-small
          TARE_MODEL_REQUIRED: "1"
        run: go test -count=1 -v -run 'TestGoldenMatchesONNX|TestPhase2a_' ./internal/tare/kompress

  # Formal static-analysis gate: golangci-lint (errcheck, govet, ineffassign,
  # staticcheck, unused). Config in .golangci.yml. Blocking — a finding fails the
  # build. (go vet also runs in the test job; pinned here under the lint suite too.)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Must EQUAL go.mod's `toolchain` (go1.26.10): golangci-lint refuses to run if it
          # was built with a Go older than the module's targeted version. (The test/build
          # jobs can stay on 1.25 — `go test`/`go build` auto-fetch the toolchain; a
          # `go install`-built golangci-lint does not, so it needs the newer Go here.)
          # ">=" was the old wording and it is too weak to be checkable: go.mod's toolchain
          # is a FLOOR, so a pin ABOVE it is not pulled back down. internal/toolchainaudit
          # asserts equality — change this and go.mod together or the guard reds.
          go-version: "1.26.10"
          cache: false
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  # THE TWO SHIPPED SDKs, WHICH RAN IN NOTHING UNTIL THIS JOB.
  #
  # ⚠ THE ABSENCE WAS ITSELF A FINDING, AND IT WAS WRITTEN DOWN BEFORE IT WAS FIXED.
  # internal/attribution/sdk_header_sync_guard_test.go opens with it: *"The SDKs are in no CI
  # workflow, no Makefile target and no Go test, and the drift that resulted was
  # X-Talyvor-Repository: emitted by both SDKs, documented in both READMEs, and stored by
  # nothing."* That guard reads the SDKs' header CONSTANTS from Go. It cannot execute them, so it
  # cannot see a defect in what the clients DO — and there was one: `set_branch(b, pr)` followed
  # by `set_session(...)` dropped X-Talyvor-PR in BOTH SDKs, in the same place, for the same
  # reason. Both suites already existed, both were green, and neither had ever run outside a
  # developer's shell.
  #
  # Both are pinned to the versions their own manifests declare and neither needs a network
  # service. `pip install -e .[dev]` brings pytest; the TypeScript devDependencies bring jest.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: python SDK
        run: |
          cd sdk/python
          python -m pip install --quiet -e ".[dev]"
          python -m pytest tests -q
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: typescript SDK
        run: |
          cd sdk/typescript
          npm ci
          npx tsc --noEmit
          npm test
      # B18.15: both SDKs, on the new /v1 path and the old one a released Python SDK sends, through
      # the real proxy handler. Needs the Python and Node installs above, so it runs here.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - name: SDKs through the real proxy handler
        env:
          LENS_SDK_E2E: "1"
        run: go test ./internal/proxy -run '^TestSDKBaseURL' -count=1 -v

  # B40.1 — the official TypeScript MCP SDK client against /mcp: Streamable HTTP and the 2024-11-05 HTTP+SSE
  # transport, every tool's annotations, agent_balance and agent_pay on an agent's own key, the payment checked on
  # the ledger. LENS_MCP_SDK_E2E=1 makes a missing SDK install a failure instead of the skip it is elsewhere.
  mcp-sdk:
    runs-on: ubuntu-latest
    env:
      LENS_TEST_DATABASE_URL: postgres://postgres:lens_test@localhost:5432/lens_test?sslmode=disable
      LENS_MCP_SDK_E2E: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: lens_test
          POSTGRES_DB: lens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: install the official MCP SDK
        run: npm ci --prefix internal/mcp/testdata/sdk-client
      - name: the official MCP SDK client against /mcp
        run: go test -count=1 -v -run '^TestOfficialTypeScriptSDKClient' ./internal/mcp

  # Supply-chain gate: govulncheck against the Go vulnerability DB. This is the
  # standing guard for the unmaintained-but-sandboxed github.com/ledongthuc/pdf
  # dependency (see internal/distill/pdf.go): a future CVE in it — or any dep, or
  # the stdlib — fails the build so we ACT on it, rather than silently carrying a
  # vulnerable parser of attacker-controlled input. govulncheck is
  # reachability-aware (reports only vulns on code paths the binary actually
  # calls), so it stays low-noise: a require-only/unreachable vuln does not fail.
  # Tool pinned; the vuln DB is fetched fresh at scan time.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10" # keep in lockstep with go.mod toolchain so stdlib vulns are assessed against the shipped runtime — ENFORCED by internal/toolchainaudit, because a pin ABOVE go.mod's toolchain grades a stdlib nothing ships and this gate would go green over a vulnerable binary
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Semgrep's managed default ruleset over the whole repo (B42.4), the same pinned image Track and
  # Docs use (semgrep/semgrep:1.178.0, pinned by digest so a new release cannot change the verdict
  # without a commit). Fails on ERROR severity; every WARNING finding is fixed or carries a
  # nosemgrep reason in place.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Semgrep default ruleset
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --config p/default --metrics=off --severity ERROR --error --quiet

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: false
      - name: Build binary
        run: |
          VERSION="$(git rev-parse --short HEAD)"
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-w -s -X main.lensVersion=${VERSION}" \
            -o bin/lens ./cmd/lens
          # THE GATE FOR THIS CLASS. A version constant that nothing sets looks
          # exactly like information while carrying none — the same shape as a
          # guard that never runs. A unit test cannot see whether the link step
          # happened, so the check belongs here, against the built artifact:
          # drop the -X flag and this fails.
          got="$(./bin/lens version)"
          echo "built binary reports: ${got}"
          if [ "${got}" = "dev" ]; then
            echo "::error::the release binary reports the unstamped placeholder — -X main.lensVersion was not applied"
            exit 1
          fi
          test "${got}" = "${VERSION}"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lens-binary
          path: bin/lens
