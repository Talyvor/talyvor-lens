# Talyvor Lens — production docker-compose
#
# Deploy: `cp .env.production.example .env`, set POSTGRES_PASSWORD, a provider
# key, and LENS_DOMAIN in .env, then `docker compose up -d`. The stack FAILS
# CLOSED if POSTGRES_PASSWORD is unset (compose ${POSTGRES_PASSWORD:?}) — there
# is no weak default, so an insecure DB password can never silently reach
# production.
# The Caddy service terminates TLS on :443 (automatic Let's Encrypt for
# LENS_DOMAIN) and reverse-proxies to lens over the internal network. Lens
# itself listens on :8080, published only on 127.0.0.1 (loopback) — the
# internet reaches it ONLY through Caddy. `/` serves a small status page (what
# this host is, live health, where the app and docs are — no account data, since
# it holds no credential); the OpenAI-compatible proxy is at /v1/proxy/*. The
# same page is also served at /dashboard when LENS_DASHBOARD_ENABLED is set
# (default off). The real dashboard is the separate suite app.
# See docs/remote-host.md to put this on a public host.
#
# Image source: defaults to the public registry tag. `docker compose build`
# rebuilds from the local Dockerfile if you want to run unreleased code.

services:
  lens:
    image: ghcr.io/talyvor/talyvor-lens:latest
    build:
      context: .
    # Loopback-only publish: lens is reachable from the HOST at 127.0.0.1:8080
    # (local dev, `make status`, the tools/trial harness, and admin bootstrap
    # over an SSH tunnel) but NEVER from the public internet — that path is
    # Caddy :443 only. Change this to 0.0.0.0 / "8080:8080" and you re-expose the
    # raw HTTP proxy + the admin surface directly to the internet.
    ports:
      - "127.0.0.1:8080:8080"
    # ADDITIVE to the curated environment: list below (#371/#373), which stays as the documented
    # critical set and keeps its guards. This forwards .env WHOLESALE so reachability no longer
    # depends on remembering to add an entry: internal/config reads 160 LENS_* variables and the
    # list names 44, so 116 were unreachable however an operator set them. Five were found mute by
    # accident in one day, each by an unrelated investigation and never by a gate.
    #
    # ⚠ LEAKAGE — THE ORIGINAL REASONING WAS RIGHT ABOUT THE DOCUMENTED SHAPE AND WRONG ABOUT THE
    # DEPLOYED ONE, so this forwards lens.env and NOT .env.
    #
    # It used to say "on the documented shape the only non-LENS_ variable is POSTGRES_PASSWORD".
    # That is true of .env.example / .env.production.example in THIS repo. It is not true of the
    # .env that exists on the box: talyvor-suite's deploy/README.md (lines 470-476) instructs the
    # operator to run, in this very directory,
    #
    #     printf 'TRACK_GATEWAY_AUTH_SECRET=%s\nDOCS_GATEWAY_AUTH_SECRET=%s\n' ... >> .env
    #
    # so the deployed .env carries two OTHER services' gateway auth secrets. Forwarding it put them
    # in this process, where Lens has no use for them and a compromise or crash dump exposes them.
    #
    # ⚠ AND NO TEST IN THIS REPOSITORY COULD HAVE CAUGHT THAT. compose_env_mechanism_test.go reads
    # the example files here; the hazard is written by a deploy step in a different repository. The
    # static check is structurally blind to it and now says so. What actually covers it is the
    # BOOT-TIME check in cmd/lens (logEnvironmentHygiene): it reads the real process environment, so
    # it sees what is actually there rather than what this repo documents.
    #
    # lens.env is LENS_* only. .env stays the project file for ${VAR} substitution.
    # ⚠ MIGRATION: if you set LENS_* variables in .env expecting #375's behaviour, move them to
    # lens.env. The curated environment: list below still covers the critical set either way.
    #
    # required:false so a checkout with no .env still starts. `environment:` keeps precedence, so
    # the CONSTRUCTED values below stay authoritative.
    env_file:
      - path: lens.env
        required: false
    environment:
      # Route through PgBouncer (transaction pooling) instead of Postgres directly.
      # LENS_DB_PGBOUNCER switches pgx to simple query protocol (required).
      # LENS_DB_MAX_CONNS is raised — connections are cheap against PgBouncer.
      - LENS_DATABASE_URL=postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}@pgbouncer:6432/talyvor_lens?sslmode=disable
      - LENS_DB_PGBOUNCER=true
      - LENS_DB_MAX_CONNS=100
      - LENS_REDIS_URL=redis://redis:6379
      - LENS_NATS_URL=nats://nats:4222
      - LENS_OPENAI_API_KEY=${LENS_OPENAI_API_KEY:-}
      - LENS_ANTHROPIC_API_KEY=${LENS_ANTHROPIC_API_KEY:-}
      - LENS_GOOGLE_API_KEY=${LENS_GOOGLE_API_KEY:-}
      - LENS_MISTRAL_API_KEY=${LENS_MISTRAL_API_KEY:-}
      - LENS_GROQ_API_KEY=${LENS_GROQ_API_KEY:-}
      - LENS_VLLM_BASE_URL=${LENS_VLLM_BASE_URL:-}
      - LENS_VLLM_API_KEY=${LENS_VLLM_API_KEY:-}
      - LENS_AWS_REGION=${LENS_AWS_REGION:-us-east-1}
      - LENS_AWS_ACCESS_KEY_ID=${LENS_AWS_ACCESS_KEY_ID:-}
      - LENS_AWS_SECRET_ACCESS_KEY=${LENS_AWS_SECRET_ACCESS_KEY:-}
      # ⚠ A THIRD INSTANCE OF THE SAME TRAP, found by sweeping the credential class rather than
      # by someone hitting it. Bedrock via TEMPORARY credentials (STS / assume-role / SSO) needs
      # a session token alongside the id+secret above; config.go:1035 reads it and it was never
      # forwarded, so those credentials could not authenticate and only long-lived static keys
      # worked. Empty ⇒ static-key auth, exactly as before.
      - LENS_AWS_SESSION_TOKEN=${LENS_AWS_SESSION_TOKEN:-}
      - LENS_OLLAMA_URL=${LENS_OLLAMA_URL:-}
      - LENS_LOG_LEVEL=${LENS_LOG_LEVEL:-info}
      # Identity / admin / bootstrap. These are read by config.Load but were never
      # passed through, so setting them in .env did nothing and the container saw an
      # empty value. All use the `:-` shape so an unset var passes as empty and keeps
      # its documented fail-safe default: LENS_API_KEY empty ⇒ NO request can be admin
      # (internal/auth/manager.go:298 — the entire fail-closed posture, unchanged);
      # LENS_JWT_PRIVATE_KEY / LENS_POVI_CHALLENGE_KEY empty ⇒ an ephemeral key is
      # generated (fine for a single non-HA instance; set them so JWTs and node-pinned
      # pubkeys survive a restart — required under LENS_HA_ENABLED); LXC-grant flag
      # empty ⇒ off.
      - LENS_API_KEY=${LENS_API_KEY:-}
      # ⚠ THE SECOND VICTIM OF THE TRAP BELOW. LENS_MINT_KEY (#402) is the NARROW credential the
      # content services hold: it mints a per-workspace token and nothing else. Generated into
      # .env and never declared here, so os.Getenv returned "" and the digest inside the running
      # container was e3b0c44298fc1c14 — the SHA-256 of the EMPTY STRING. The feature was simply
      # inert, with no log line saying so, exactly as the note below predicted.
      #
      # Empty ⇒ absent, and minting stays admin-only exactly as before (cmd/lens/main.go:718).
      # It is deliberately NOT defaulted to LENS_API_KEY: a default that silently grants admin is
      # the failure #402 exists to remove.
      - LENS_MINT_KEY=${LENS_MINT_KEY:-}
      # LENS_OPERATOR_READ_KEY (W1.3) is the READ-SIDE SIBLING of LENS_MINT_KEY: the credential the
      # suite BFF presents for the cross-tenant admin READS behind its operator boundary (suite
      # #87, whose routes answer 501 today because the BFF holds no credential Lens accepts).
      #
      # It authenticates with IsAdmin=FALSE and exactly one scope, `operator_read`, so it reaches
      # the fifteen admin GETs that opted in by name and nothing else — every requireAdmin gate
      # refuses it, every {wsID} route 403s it (it owns no workspace), the proxy scope gate refuses
      # it, and POST /v1/auth/token refuses it so it cannot mint its way out.
      # cmd/lens/operator_read_credential_test.go asserts each of those, each against a control.
      #
      # Empty ⇒ absent: the admin reads stay reachable only by LENS_API_KEY, exactly as before.
      # Deliberately NOT defaulted to LENS_API_KEY, for the reason directly above — and the reason
      # is sharper here: this credential's whole purpose is that a SESSION GATEWAY, the most
      # exposed process in the estate, never holds a key that can mint LXC, approve a conversion
      # rate or revoke a payout.
      #
      # ⚠ SET IT TO A DIFFERENT VALUE FROM LENS_MINT_KEY. Neither is a superset of the other, so a
      # collision has to resolve one way: mint wins, and the operator screen 401s. That is the safe
      # direction (visibly broken beats silently over-privileged) but it is still broken.
      - LENS_OPERATOR_READ_KEY=${LENS_OPERATOR_READ_KEY:-}
      - LENS_JWT_PRIVATE_KEY=${LENS_JWT_PRIVATE_KEY:-}
      - LENS_POVI_CHALLENGE_KEY=${LENS_POVI_CHALLENGE_KEY:-}
      - LENS_ADMIN_LXC_GRANT_ENABLED=${LENS_ADMIN_LXC_GRANT_ENABLED:-}

      # ── OPERATOR ALERTING + CATALOG DRIFT ────────────────────────────────────────────────
      # ⚠ EVERY LINE HERE EXISTS BECAUSE OF THE SAME TRAP THAT HID LENS_PROVISION_SECRET, AND
      # THEN LENS_MINT_KEY: this service has an explicit `environment:` list and NO `env_file:`,
      # so a variable set in .env that is not named below reaches NOTHING. The container starts
      # healthy and the feature is simply inert, with no log line saying why.
      #
      # ⚠ IT HAS NOW HAPPENED TWICE, which is why prose is no longer the guard. #402's
      # LENS_MINT_KEY was generated into .env, the stack restarted, and the digest in the running
      # container was the SHA-256 of the empty string. The mechanical check that would have caught
      # both — os.Getenv("X") in the tree with no `X=` in this list — now runs in CI; see
      # compose_env_reach_test.go. Adding a variable to the code without adding it here fails
      # that test rather than shipping a silently dead feature.
      #
      # LENS_TRACK_WEBHOOK_* is the Lens→Track spend-alert emitter (internal/alerts/emitter.go).
      # It has NEVER been passed here, so alerts.NewEmitter has always returned nil and NO SPEND
      # ALERT HAS EVER BEEN DELIVERED — silently, because an unconfigured emitter is a total
      # no-op. Track's receiver is real and gateway-exempt: POST /v1/lens/webhook, HMAC-verified
      # against Track's TRACK_LENS_WEBHOOK_SECRET, which MUST hold the same value as the secret
      # below — different names, one value, the same shape as GATEWAY_AUTH_SECRET.
      - LENS_TRACK_WEBHOOK_URL=${LENS_TRACK_WEBHOOK_URL:-}
      - LENS_TRACK_WEBHOOK_SECRET=${LENS_TRACK_WEBHOOK_SECRET:-}
      #
      # ⚠ LENS_OPERATOR_ALERT_WEBHOOK_* IS PLUMBING FOR A RECEIVER THAT DOES NOT EXIST YET.
      # The catalog-drift alert (internal/modelwatch) POSTs a `catalog_drift` payload. NOTHING on
      # the box accepts that type today. Track's /v1/lens/webhook handles only "spend_alert" and
      # its default branch logs "ignoring unknown webhook type" and returns 200 — which this
      # client would read as DELIVERED and never retry. Pointing this at Track is therefore worse
      # than leaving it unset: the metric would read sink_configured=1 while nobody is told.
      # Leave BOTH unset until a receiver exists (see the follow-up report). The lines are here
      # so that the day one does, it is a .env edit and not a compose change nobody remembers.
      - LENS_OPERATOR_ALERT_WEBHOOK_URL=${LENS_OPERATOR_ALERT_WEBHOOK_URL:-}
      - LENS_OPERATOR_ALERT_WEBHOOK_SECRET=${LENS_OPERATOR_ALERT_WEBHOOK_SECRET:-}
      #
      # ⚠ LENS_MODEL_CATALOG_OVERRIDES is the remedy the unpriced-model alert NAMES ("add the
      # model via LENS_MODEL_CATALOG_OVERRIDES, no rebuild"). It was never passed through, so
      # that instruction was inoperable on this compose: an operator following it exactly would
      # see nothing change and have no way to tell why. Adding a model here is strictly better
      # than the derived floor, because it replaces a guess with the published rate.
      - LENS_MODEL_CATALOG_OVERRIDES=${LENS_MODEL_CATALOG_OVERRIDES:-}
      # Catalog-drift poller. Default ON in code; these allow disabling or re-pacing it.
      - LENS_MODEL_WATCH_ENABLED=${LENS_MODEL_WATCH_ENABLED:-}
      - LENS_MODEL_WATCH_INTERVAL=${LENS_MODEL_WATCH_INTERVAL:-}
      # Documented in .env.production.example but never passed — the same trap, found by sweeping
      # the example file against this list.
      - LENS_PATTERN_CAPTURE_ENABLED=${LENS_PATTERN_CAPTURE_ENABLED:-}
      # Per-user signup provisioning (POST /v1/provision). This MUST be forwarded: without the
      # line, setting it in .env reaches nothing, and because provisioning fails CLOSED the route
      # is simply not registered — Lens boots healthy, passes its healthcheck, serves everything
      # else, and 404s every login from a suite BFF that expects it. That is a broken deploy
      # wearing a green healthcheck, and it was one missing line.
      #
      # `:-` and NOT `:?`: an empty value must stay legal. Most deployments run Lens with no BFF
      # and never want provisioning; making the variable mandatory would turn an optional
      # capability into a hard boot dependency for all of them. Unset ⇒ empty ⇒ route
      # unregistered ⇒ boot logs a WARN naming this variable (cmd/lens/main.go).
      - LENS_PROVISION_SECRET=${LENS_PROVISION_SECRET:-}

      # ── The money path. ⚠ EVERY ONE OF THESE WAS MUTE. ────────────────────────
      # `.env` is NOT passed into containers: compose reads it only for ${}
      # substitution inside this file, and this stack declares no `env_file:`. So a
      # variable reaches the process if and only if it is listed HERE. Setting one in
      # .env and not here looks correct in review, survives a restart, and does
      # nothing — the failure LENS_PROVISION_SECRET already caused once.
      #
      # These are the ones whose silence costs money. cmd/lens/compose_env_reach_test.go
      # holds the list and the rule for adding to it.
      #
      # LENS_CACHE_POOLABLE_ENABLED is the GLOBAL gate on cross-tenant pooling — one of
      # three gates (this, the per-workspace cache_poolable, and earn_verified on both
      # sides). Mute, it shuts pooling off entirely no matter how many workspaces opt
      # in, and reports nothing: the royalty test simply shows no mint, with no way to
      # tell "not implemented" from "not switched on".
      - LENS_CACHE_POOLABLE_ENABLED=${LENS_CACHE_POOLABLE_ENABLED:-}
      # ON by default (B11.4): a shared conversion is reused only for a byte-identical document (distill.ContentHash).
      - LENS_DISTILL_POOLABLE_ENABLED=${LENS_DISTILL_POOLABLE_ENABLED:-true}
      - LENS_ECONOMY_ENABLED=${LENS_ECONOMY_ENABLED:-}
      - LENS_POOL_ROYALTY_MINTING_ENABLED=${LENS_POOL_ROYALTY_MINTING_ENABLED:-}
      # Shadow mode for the six unproven mints: they compute what they WOULD pay, record it to
      # lens_shadow_mints, and credit nothing. Plumbed here for the reason #371 exists — a money
      # -path gate set in .env and not listed here never reaches the process, and this one going
      # mute would be the worst version of that: shadow mode silently off while the operator
      # believes the trial is being measured.
      - LENS_SHADOW_MINTS_ENABLED=${LENS_SHADOW_MINTS_ENABLED:-}
      # Also a SECURITY parameter: the anti-self-dealing property is that a Sybil pair
      # loses (1-s)*C per cycle, so s must stay < 1 (config.go refuses to boot at >= 1).
      - LENS_POOL_ROYALTY_SHARE=${LENS_POOL_ROYALTY_SHARE:-}
      # The pooling similarity threshold, DECLARED rather than left to config's default (B9.4). Boot refuses
      # pooling when it is below the attested safety floor (lens poolcheck; 0.9377 on 2026-09-25, set by the
      # consumer danger pair isa-year — at 0.92 it would be served). Raise it freely; lowering it turns pooling off.
      - LENS_SEMANTIC_THRESHOLD=${LENS_SEMANTIC_THRESHOLD:-0.98}
      # The "would have pooled" log (B9.6): one fingerprint-only pooled_shadow_observations row per fresh,
      # cacheable answer, so pooling is measured on real traffic, not test corpora. Persist-only — it cannot
      # serve, pool or mint. ON by default; config's own default is off, so without this line it never runs.
      - LENS_POOL_SHADOW_LOG_ENABLED=${LENS_POOL_SHADOW_LOG_ENABLED:-true}
      - LENS_MINT_RATE_CAP_LENS_24H=${LENS_MINT_RATE_CAP_LENS_24H:-}

      # ── Customer money IN. Mute ⇒ nobody can buy LXC, and nothing says so. ────
      - LENS_BILLING_ENABLED=${LENS_BILLING_ENABLED:-}
      - LENS_STRIPE_SECRET_KEY=${LENS_STRIPE_SECRET_KEY:-}
      - LENS_STRIPE_WEBHOOK_SECRET=${LENS_STRIPE_WEBHOOK_SECRET:-}
      - LENS_BILLING_SUCCESS_URL=${LENS_BILLING_SUCCESS_URL:-}
      - LENS_BILLING_CANCEL_URL=${LENS_BILLING_CANCEL_URL:-}
      # Model 2 subscriptions. Empty (and, on a test-mode key, no talyvor_*_monthly Price in Stripe — B17.21)
      # ⇒ /billing/subscribe and its siblings are not registered.
      - LENS_BILLING_SUBSCRIPTION_PRICE_ID=${LENS_BILLING_SUBSCRIPTION_PRICE_ID:-}
      # B13.1 — the named plans (plus=price_…,pro=price_…,max=price_…). Empty ⇒ only the single price above.
      - LENS_BILLING_SUBSCRIPTION_PLANS=${LENS_BILLING_SUBSCRIPTION_PLANS:-}
      # D, the allowance each paid period grants, in µLXC. Empty/0 ⇒ subscribers get no allowance.
      - LENS_SUBSCRIPTION_ALLOWANCE_ULXC=${LENS_SUBSCRIPTION_ALLOWANCE_ULXC:-}
      # The browser chat's credential (B10.7). ON by default (Nicolai: every capability on): without it
      # /v1/auth/session-keys is never registered and the chat's mint gets a 404. Every chat request is
      # charged (B9.8). TTL empty ⇒ config's DefaultSessionKeyTTL.
      - LENS_SESSION_KEYS_ENABLED=${LENS_SESSION_KEYS_ENABLED:-true}
      - LENS_SESSION_KEY_TTL=${LENS_SESSION_KEY_TTL:-}
      # Provider-secret envelope KEK (W6.10). Comma-separated base64 32-byte keys, PRIMARY FIRST
      # (`openssl rand -base64 32`). Empty ⇒ Lens boots with provider-secret custody DISABLED and no
      # plaintext fallback; a wrong length is fail-loud at startup. Declared here because the trap
      # this file keeps setting is a variable the compose stack never forwards: `.env` is read only
      # for ${VAR} substitution INSIDE this file, so an operator who sets a KEK in .env and nowhere
      # else gets a Lens that silently cannot hold a customer credential.
      # ⚠ LOSING THIS KEY MAKES EVERY STORED PROVIDER SECRET UNRECOVERABLE — see
      # docs/provider-secret-envelope.md before rotating.
      - LENS_PROVIDER_SECRET_KEK=${LENS_PROVIDER_SECRET_KEK:-}
      # Pattern mining/earning (runbook Trap 5 — "opt-in succeeds, earning silently zero").
      # These were only ever passed by a gitignored docker-compose.override.yml, so a fresh
      # clone could never enable them. `:-` is safe for BOTH defaults: MINING is parseBoolEnv
      # (config.go:911) so empty ⇒ false (the opt-in route 503s until you set it true); EARNING
      # is in the economy default-ON loop (config.go:1682-1688) which only overrides when the
      # env value is NON-EMPTY, so empty ⇒ its default TRUE is preserved (no silent disable).
      - LENS_PATTERN_MINING_ENABLED=${LENS_PATTERN_MINING_ENABLED:-}
      - LENS_PATTERN_EARNING_ENABLED=${LENS_PATTERN_EARNING_ENABLED:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Container hardening (defense-in-depth). Lens is our own static, non-root
    # (USER lens, uid 65532), CGO-free binary that binds an unprivileged port
    # (8080) and keeps no on-disk state — so it can run fully locked down:
    #   - read_only           root filesystem is immutable; an attacker who gets
    #                          code execution cannot drop a payload or rewrite /lens
    #   - cap_drop: ALL        the process needs zero Linux capabilities
    #   - no-new-privileges    blocks privilege escalation via setuid binaries
    # tmpfs gives the one writable path the runtime may need (temp files); it is
    # ephemeral and noexec so it can't be used to stage an executable.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Schema migrations run once per compose-up via the gateway image's own
  # `lens migrate` subcommand: embedded SQL, version-tracked in
  # schema_migrations (already-applied versions are skipped — re-running every
  # `up` is a no-op), fail-loud on error. Same mechanism as the Helm migrate
  # hook. Connects DIRECT to Postgres, never through PgBouncer — DDL through a
  # transaction-mode pooler is unsafe.
  #
  # The SQL ships inside the image (migrations/embed.go), so a newly authored
  # migration needs `docker compose build` (or a fresh pull) to be applied.
  #
  # Databases bootstrapped by the OLD psql-loop sidecar have a full schema but
  # an empty schema_migrations — run deploy/migrate-baseline-stamp.sh ONCE
  # before the first `lens migrate` against such a database.
  migrate:
    image: ghcr.io/talyvor/talyvor-lens:latest
    build:
      context: .
    command: ["migrate"]
    environment:
      LENS_DATABASE_URL: postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}@postgres:5432/talyvor_lens?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Safe baseline: block setuid privilege escalation. Not read_only/cap_drop:ALL
    # because psql needs a writable HOME/tmp and this is a short-lived one-shot.
    security_opt:
      - no-new-privileges:true

  # PgBouncer sits between Lens and Postgres and multiplexes many application
  # connections onto a small pool of real server connections. Transaction
  # pooling mode (one server connection per transaction) is the most efficient
  # mode for OLTP workloads and what Lens is tuned for (LENS_DB_PGBOUNCER=true).
  # edoburu/pgbouncer (maintained; the previous bitnami/pgbouncer:1 was purged
  # from Docker Hub in 2025, #126). Its env contract: the [databases] entry key
  # IS DB_NAME, so lens's .../talyvor_lens connection string resolves directly.
  # Two non-obvious defaults are overridden deliberately:
  #   LISTEN_PORT  — image default 5432, we serve on 6432;
  #   AUTH_TYPE    — image default md5, but Postgres 16 stores SCRAM verifiers;
  #                  scram-sha-256 makes the entrypoint keep the plaintext
  #                  password so BOTH legs (client→pgbouncer, pgbouncer→postgres)
  #                  complete SCRAM.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=talyvor_lens
      - DB_USER=lens
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=2
      - SERVER_IDLE_TIMEOUT=600
      # After a Postgres outage PgBouncer caches the failed server login and
      # retries only every server_login_retry seconds (default 15) — measured
      # as ~half of the 33s end-to-end recovery after a DB SIGKILL, and the
      # cached error was twice observed wedging the pooler (issue #174,
      # 2026-06-12 chaos session; second occurrence needed a manual restart).
      # 3s keeps retries cheap while making recovery prompt.
      - SERVER_LOGIN_RETRY=3
    # autoheal opt-in (see the autoheal service): pgbouncer is the one service
    # observed wedging running-but-unhealthy (#174), and a wedged pooler serves
    # nothing — restart is always the right call. Deliberately NOT set on lens:
    # lens reports unhealthy while correctly serving through a DB outage, and
    # auto-restarting it would kill a working gateway.
    labels:
      - autoheal=true
    depends_on:
      postgres:
        condition: service_healthy
    # psql SELECT 1 through the pooler, not pg_isready: it validates the
    # [databases] entry + auth + backend end-to-end (pg_isready counts ANY
    # server response — including "no such database" — as healthy).
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$DB_PASSWORD psql -h 127.0.0.1 -p 6432 -U $$DB_USER -d talyvor_lens -tAc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Safe baseline only. PgBouncer (Bitnami) renders its config at startup and
    # needs a writable filesystem, so read_only/cap_drop:ALL would break it.
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: talyvor_lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.production.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d talyvor_lens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Safe baseline only. Postgres needs capabilities for initdb (chown/setuid)
    # and a writable data dir, so read_only/cap_drop:ALL would break startup.
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Safe baseline only. Redis persists the append-only file to /data, so a
    # read_only root fs would need extra tmpfs wiring; keep it simple and safe.
    security_opt:
      - no-new-privileges:true

  nats:
    image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-m", "8222"]
    # No host publish. NATS is an INTERNAL message bus — every service reaches it
    # at nats://nats:4222 over the compose network. Publishing 4222 on 0.0.0.0
    # (the previous config) put an UNAUTHENTICATED bus on the public interface of
    # any internet-facing VM. The -m 8222 monitoring endpoint is internal-only too.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Safe baseline only. JetStream (-js) needs a writable store dir, so keep
    # read_only off here; no-new-privileges is still a free hardening win.
    security_opt:
      - no-new-privileges:true

  # Auto-heal: docker's restart policies fire only on PROCESS DEATH — a
  # running-but-unhealthy container is never restarted by compose (observed
  # live in the #174 chaos session: pgbouncer sat wedged-unhealthy after a DB
  # outage until a human ran `restart pgbouncer`). This sidecar watches Docker
  # health status and restarts containers labeled autoheal=true.
  #
  # Security tradeoff, stated honestly: it mounts the Docker socket, which is
  # root-equivalent control of the host. Standard practice for this pattern,
  # image is pinned, and it runs no exposed ports — but reviewers should be
  # aware this is the one container with host-level power.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true

  # ── TLS front door ──────────────────────────────────────────────────────────
  # Caddy terminates HTTPS on :443 (and 301-redirects :80) and reverse-proxies to
  # lens over the internal network. Chosen over lens's built-in Let's Encrypt
  # autocert (cmd/lens/serve.go, LENS_TLS_DOMAIN) because autocert needs a
  # WRITABLE cert cache on the lens container — which would force relaxing
  # `read_only: true`, a hardening property worth keeping. Caddy owns its own cert
  # store (the caddy_data volume), so lens stays fully locked down and cert-free.
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Your public hostname (or `localhost` for a local run). Required — the
      # stack fails closed rather than silently serving on the wrong name. Caddy
      # provisions + auto-renews the Let's Encrypt cert for it (no email needed).
      - LENS_DOMAIN=${LENS_DOMAIN:?LENS_DOMAIN must be set — your public hostname, or localhost for a local run (see .env.production.example)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      lens:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── Track ──────────────────────────────────────────────────────────────────
  # Schema first. restart:"no" + service_completed_successfully is the same
  # gate the lens stack uses for its own `migrate` service, so `up -d` cannot
  # start the API against an unmigrated database.
  track-migrate:
    image: ghcr.io/talyvor/talyvor-track:latest
    command: ["migrate", "up"]
    environment:
      TRACK_DATABASE_URL: postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/talyvor_track?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  track:
    image: ghcr.io/talyvor/talyvor-track:latest
    environment:
      TRACK_DATABASE_URL: postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/talyvor_track?sslmode=disable
      TRACK_LISTEN_ADDR: 0.0.0.0:3000
      # Track's copy of the transit proof. MUST equal the BFF's
      # TRACK_GATEWAY_SECRET — different names, one value. Boot-required and
      # >= 16 chars (internal/config/config.go:106).
      GATEWAY_AUTH_SECRET: ${TRACK_GATEWAY_AUTH_SECRET:?TRACK_GATEWAY_AUTH_SECRET must be set — see deploy/README.md}
      # Serves the two gwExempt service endpoints Docs pulls: GET /v1/service/members
      # (rosters) and GET /v1/service/workspaces (which workspaces exist — track #64).
      # ONE secret gates both; Docs sends it as `Authorization: Bearer`.
      # OPTIONAL to Track (unset ⇒ Track boots and both endpoints 401 everything), but
      # REQUIRED for Docs membership to work at all. >= 16 chars, enforced at boot.
      TRACK_MEMBER_SYNC_SECRET: ${MEMBER_SYNC_SECRET:?MEMBER_SYNC_SECRET must be set — see FULL-STACK-DEPLOY.md STEP 1}
      # ── Lens: Track's AI + per-issue cost ─────────────────────────────────────
      # ⚠ THE THIRD AND FOURTH INSTANCES OF THE TRAP #406 CLOSED FOR LENS. None of the
      # lines below existed, so Track's Lens client has never been configured and every
      # AI feature has been a silent no-op since it shipped. Same mechanism as
      # LENS_PROVISION_SECRET and LENS_MINT_KEY: this service has an explicit
      # `environment:` map and no `env_file:`, so a variable set in .env that is not
      # named here reaches nothing, and the container still starts healthy.
      TRACK_LENS_URL: http://lens:8080
      # ⚠ THE NARROW MINT CREDENTIAL, AND THE WHOLE POINT OF #402. It can mint a
      # per-workspace token and nothing else: Lens gives it scope {mint} with
      # IsAdmin=false (internal/auth/manager.go:339), so every admin gate refuses it.
      # ⚠ NEVER put LENS_API_KEY's value here. Track's own config says so verbatim —
      # "Never set this to Lens's global LENS_API_KEY" (config.go:29) — because the
      # global admin key must not enter one of the two most exposed services.
      TRACK_LENS_MINT_KEY: ${LENS_MINT_KEY:-}
      # ⚠ DECLARED SO IT CAN BE SET, AND IT MUST STAY EMPTY TODAY. This is Track's READ
      # client (cmd/track/main.go:246): per-workspace spend summaries and anomalies.
      # Track is multi-tenant, so it reads /v1/api/spend/*?workspace_id=<ws> once per
      # workspace — whatever sits here must be able to read ANY of them. Nothing can:
      #
      #   the MINT key   → 403. Lens's effectiveWorkspaceID (internal/api/server.go:1204)
      #                    honours ?workspace_id= only for an ADMIN credential; the mint
      #                    key resolves to no workspace at all.
      #   a tlv_ KEY     → ⚠ 200, WITH THE WRONG WORKSPACE'S NUMBERS. A non-admin does not
      #                    get its request REFUSED — the parameter is IGNORED and its own
      #                    workspace is read, under the caller's label. Track would land
      #                    workspace B's spend on workspace A's issues as their AI cost.
      #   the ADMIN key  → works, and is precisely what #402 keeps out of Track.
      #
      # All three are asserted over real HTTP in internal/api/track_read_credential_test.go,
      # because a money-path claim an operator cannot run is prose.
      #
      # ⚠ AND EMPTY IS NOT THE SAME AS OFF — the earlier draft of this comment said the
      # cost sync "stays off", and that is FALSE. Track's IsConfigured() keys on the URL
      # ALONE (talyvor-track internal/lensintegration/client.go:78,
      # `return c != nil && c.lensURL != ""`), so declaring TRACK_LENS_URL above STARTS
      # the 15-minute syncer with no credential: its client omits the Authorization header
      # entirely when the key is empty (client.go:107). What makes that harmless is that
      # Lens REFUSES an unauthenticated spend read (401) — pinned by
      # TestTrackRead_NoCredentialNeverReachesTheData, because if that ever stops being
      # true the poller starts attributing the "default" workspace's spend to every
      # tenant. Measured behaviour today: one WARN per workspace per tick
      # ("lensintegration: sync failed"), and NOTHING written — the syncer returns before
      # any store call (syncer.go SyncFeatureSpend).
      #
      # Closing this needs Track to mint a per-workspace token for its reads the way Docs
      # already does (lenscreds), or Lens to grow a read scope the mint key can carry.
      # That is a decision and a code change, not a value in .env.
      TRACK_LENS_API_KEY: ${TRACK_LENS_API_KEY:-}
      # HMAC secret for the INBOUND Lens→Track spend-alert webhook (POST /v1/lens/webhook,
      # gwExempt and signature-verified). ⚠ MUST be the SAME VALUE as the lens service's
      # LENS_TRACK_WEBHOOK_SECRET — different names, one value, the same shape as
      # GATEWAY_AUTH_SECRET. Empty ⇒ Track answers 401 WEBHOOK_DISABLED and fails closed.
      TRACK_LENS_WEBHOOK_SECRET: ${LENS_TRACK_WEBHOOK_SECRET:-}
      # Where Track's AI-cost API links a human for request-level detail. Unset ⇒ NO link
      # is emitted, deliberately: it used to be derived as <lens>/dashboard, a route Lens
      # registers only under LENS_DASHBOARD_ENABLED (default off) and does not forward at
      # all, so it 404'd for everyone (talyvor-track #66).
      TRACK_LENS_DASHBOARD_URL: ${TRACK_LENS_DASHBOARD_URL:-}
      TRACK_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      track-migrate:
        condition: service_completed_successfully
    # Host loopback only. Not internet-facing, no Caddy hostname.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # ── Docs ───────────────────────────────────────────────────────────────────
  # No migrate service: Docs applies pending migrations on boot, fail-closed.
  docs:
    image: ghcr.io/talyvor/talyvor-docs:latest
    environment:
      DOCS_DATABASE_URL: postgres://lens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/talyvor_docs?sslmode=disable
      DOCS_LISTEN_ADDR: 0.0.0.0:4000
      # Docs' copy of the transit proof. MUST equal the BFF's DOCS_GATEWAY_SECRET.
      # Boot-required, >= 16 chars, AND permanently rejects the published
      # placeholder "dev-only-insecure-gateway-secret-change-me" regardless of
      # length (internal/config/config.go:137,196) — it is in git history, so it
      # is public forever.
      GATEWAY_AUTH_SECRET: ${DOCS_GATEWAY_AUTH_SECRET:?DOCS_GATEWAY_AUTH_SECRET must be set — see deploy/README.md}
      # ⚠ NOT TENANCY ANY MORE — do not pair this with anything on the BFF.
      # It used to have to equal the BFF's DOCS_WORKSPACE_ID, which pinned one Docs
      # workspace for everyone. suite #59 (030ea53) removed that variable: every Docs
      # route now resolves the SESSION's Track workspace (docsWorkspaceFor).
      # What still reads it, both single-workspace background jobs:
      #   · the COST syncer's scope (off here — DOCS_TRACK_API_KEY is unset)
      #   · the daily 09:00 UTC stale-page freshness digest
      # Optional, defaults to "default" in Docs' own config. Left explicit so the
      # value is visible rather than implied.
      DOCS_DEFAULT_WORKSPACE: ${DOCS_DEFAULT_WORKSPACE:-default}
      # ── Member sync: Docs pulls tenancy from Track ────────────────────────────
      # Track is the tenancy source of truth (it mints a workspace per identity at
      # login), so Docs asks it which workspaces exist rather than deriving the set
      # from its own content — the cold-start deadlock docs #46 / track #64 closed.
      # Both are required together: MemberSyncConfigured() is trackURL && secret, and
      # either one missing makes SyncMembers a SILENT no-op.
      # ⚠ THE SAME VALUE as the track service's TRACK_MEMBER_SYNC_SECRET above — one
      # .env key feeds both, so they cannot drift.
      DOCS_TRACK_URL: http://track:3000
      DOCS_TRACK_MEMBER_SYNC_SECRET: ${MEMBER_SYNC_SECRET:?MEMBER_SYNC_SECRET must be set — see FULL-STACK-DEPLOY.md STEP 1}
      # ⚠ NOT set: DOCS_TRACK_API_KEY — AND IT COULD NOT WORK IF IT WERE, which is a
      # stronger statement than "deliberately off". It gates the COST sync (page
      # ai_cost roll-up) and the editor's issue embeds; MemberSyncConfigured() does not
      # look at it. But the client it configures sends `Authorization: Bearer <key>`
      # (talyvor-docs internal/trackintegration/client.go:229) to
      # /v1/workspaces/{ws}/issues/{id} and .../issues/search — paths INSIDE Track's
      # gatewayauth boundary, which demands X-Gateway-Auth == Track's GATEWAY_AUTH_SECRET
      # before any identity is trusted and does not accept a bearer at all. Member sync
      # works only because /v1/service/* is gwExempt with its own bearer secret.
      # Setting this would turn "silently off" into "silently 403ing". Making it work is
      # a code change in Docs (send the transit proof + identity headers, as the BFF
      # does) or a new gwExempt service endpoint in Track — not a value in .env.
      # ── Lens: Docs' AI ────────────────────────────────────────────────────────
      # ⚠ SAME TRAP AS THE TRACK BLOCK ABOVE. Neither line existed, so Docs' AI —
      # ask-AI, summarise, translate, title suggestion, changelog generation and the
      # semantic page search — has been a silent no-op since it shipped.
      DOCS_LENS_URL: http://lens:8080
      # ⚠ THE MINTING CREDENTIAL, AND ONLY THAT. cmd/docs/main.go:186 hands it to
      # lenscreds, which exchanges it at POST /v1/auth/token for a per-workspace JWT and
      # caches one per workspace, so every Lens DATA call is attributed and rate-limited
      # to its real tenant. Scope {mint} is sufficient for that exchange and nothing
      # else. ⚠ NEVER put LENS_API_KEY's value here — before lenscreds, Docs sent the
      # admin key on the data path and every tenant collapsed into one rate-limit bucket.
      DOCS_LENS_API_KEY: ${LENS_MINT_KEY:-}
      DOCS_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

