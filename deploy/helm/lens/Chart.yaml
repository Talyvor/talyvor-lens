apiVersion: v2
name: lens
description: |
  Talyvor Lens — the AI gateway. This is the ONLY Helm chart in the Talyvor
  platform: talyvor-track, talyvor-docs, talyvor-code and talyvor-suite ship
  no Chart.yaml at all (checked 2026-08-10). An earlier version of this line
  said Track/Docs/Code charts "follow the same pattern", which read as though
  they exist.

  Default install = a single gateway replica, external Postgres/Redis/NATS,
  secrets supplied by reference, and a pre-upgrade migration hook. HA,
  autoscaling, in-cluster mining nodes, and embedded databases are all opt-in.
type: application

# Chart version — bump on any chart change (SemVer).
version: 0.1.0

# appVersion tracks the Lens application version this chart deploys by default
# (used as the default image tag). Keep in sync with the Lens release.
appVersion: "0.1.0"

# Both of these were https://github.com/talyvor/lens, which 404s (checked
# 2026-08-10): the repository is `talyvor-lens`, not `lens`, and at the time the
# `talyvor` organisation did not exist either. `github.com/talyvor/lens` survives
# as the Go module path in go.mod, which is an import identifier and need not
# resolve. Then they were https://github.com/gaboracnicolai/talyvor-lens, until
# the repository moved to the Talyvor organisation on 12 Oct 2026; that address
# now only redirects. These two fields are links a chart consumer clicks, and
# they must resolve.
home: https://github.com/Talyvor/talyvor-lens
sources:
  - https://github.com/Talyvor/talyvor-lens
maintainers:
  - name: Talyvor Platform
keywords:
  - talyvor
  - lens
  - ai-gateway

# NOTE: Bitnami postgresql/redis subcharts are intentionally NOT declared here.
# They are a dev-only convenience and would force `helm dependency build`
# (network) for every lint/template. See README "Embedded databases" for the
# exact dependency block to paste in if you want them for local testing.
