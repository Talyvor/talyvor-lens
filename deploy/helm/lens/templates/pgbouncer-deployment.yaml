{{- if .Values.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lens.fullname" . }}-pgbouncer
  labels:
    {{- include "lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lens.componentSelectorLabels" (list . "pgbouncer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lens.componentSelectorLabels" (list . "pgbouncer") | nindent 8 }}
      annotations:
        # Roll PgBouncer pods when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/pgbouncer-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: {{ .Values.pgbouncer.listenPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lens.fullname" . }}-pgbouncer
          env:
            # Postgres password comes from the same Secret as the Lens gateway
            # so operators manage one secret instead of two.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lens.secretName" . }}
                  key: {{ .Values.pgbouncer.postgresPasswordSecretKey | quote }}
          # SELECT 1 through the pooler, as compose's healthcheck does: it proves the [databases]
          # entry, auth and the backend end to end. A tcpSocket probe passes on a wedged pooler
          # (#174), so Kubernetes would never restart it.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p "$LISTEN_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT 1' >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p "$LISTEN_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT 1' >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.pgbouncer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
