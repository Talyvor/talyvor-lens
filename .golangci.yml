version: "2"

# Formal static-analysis gate. The standard high-signal linters; the codebase
# passes them — real findings were fixed, not disabled.
linters:
  enable:
    - errcheck # unchecked errors
    - govet # suspicious constructs (already a CI step; pinned here too)
    - gosec # security checks (B28.258); every finding on the tree was triaged below
    - ineffassign # ineffectual assignments
    - staticcheck # the staticcheck suite (incl. gosimple, stylecheck)
    - unused # unused code
  settings:
    gosec:
      excludes:
        # errcheck (above) owns unchecked errors; gosec's copy re-reports the deferred
        # Close() calls the std-error-handling preset already judged unactionable.
        - G104
  exclusions:
    # golangci-lint's curated exclusions: deferred Close()/Flush()/print() errors on
    # cleanup are conventionally unactionable. errcheck still checks every other return.
    presets:
      - std-error-handling
    # gosec triage (B28.258). gosec (golangci-lint v2.12.2) reported 373 findings on main
    # 30c7d822: 257 in tests and 116 in shipped code (1 in a Linux-only file, so lint with
    # GOOS=linux to see it, and 3 only once another finding on the same line was excluded).
    # Each shipped one was read and is a false positive for the reason given on its rule
    # below. A rule names its files, never a whole package, so the same kind of finding in
    # any other file still fails the gate and is triaged afresh.
    rules:
      # Tests do not ship: fixture credentials, testdata paths, test servers and helpers.
      - path: _test\.go$
        linters: [gosec]
      - path: ^internal/testschema/
        linters: [gosec]
      # G101 matches a NAME containing secret/token/pass/cred. These are usage text, SQL,
      # header names, a hashing-parameter label, a file name and the Circle fake's fixed key.
      - path: ^(cmd/lens/(credit_lines_cli|credit_scores_cli|identity_gate|phone_signin_routes|provision_handler)|internal/(a2acard/a2acard|brand/brand|economy/credit_line|economy/credit_score|kya/idtoken|money/circle/circlefake/fake|phonesignin/passcode|proxy/proxy|tare/kompress/reducer))\.go$
        linters: [gosec]
        text: G101
      # G115, WebAuthn sign counts: the stored count came from the authenticator's uint32.
      - path: ^internal/(economy/(agent_approval_auth|agent_spend_permissions|negotiation_mandates|payment_approvals|permission_mandates)|phonesignin/keys)\.go$
        linters: [gosec]
        text: G115
      # G115, a × b ÷ c on 128 bits for 0 ≤ a and 0 ≤ b ≤ c (documented on the function):
      # the quotient is never more than a, so it fits back in int64.
      - path: ^internal/(economy/money_invoices|market/royalties)\.go$
        linters: [gosec]
        text: G115
      # G115, values in range by construction: length prefixes and Unix times hashed or
      # encoded as bytes, hash bits, a round-robin cursor, colour channels 0–255, Latin-1
      # runes, currency decimal places, smart-account indexes, GRIB bit widths and the page
      # size (positive; memlimit_linux.go builds on Linux only, so lint there to see it).
      - path: ^internal/(ab/engine|coderun/memlimit_linux|economy/spend_plan|localrouter/multi|market/(receipt_render|similarity|statement_pdf)|money/smartaccount/spendpermission|outputverify/identity|povi/(challenge|nodeauth|receipt)|scan/grib|stepup/stepup|webpush/webpush)\.go$
        linters: [gosec]
        text: G115
      # G118: deliberately detached background work (health checks, key enrolment,
      # indexers, last-used stamps) that must outlive the request that started it.
      - path: ^(cmd/node/server|internal/(auth/apikeys|controlplane/syncer|economy/(chain_indexer|crypto_travel_rule|key_enrolments)|mining/(compute_mining|embedding_mining)))\.go$
        linters: [gosec]
        text: G118
      # G120: the body is already capped by http.MaxBytesReader on the line above.
      - path: ^internal/proxy/speech\.go$
        linters: [gosec]
        text: G120
      # G204/G702: the docker binary, Lens's own binary, the worker binary and the node's
      # attestation tool, all from operator config; untrusted input goes in on stdin, a mounted
      # directory or a discrete integer argument, never as the program name and never a shell.
      - path: ^(cmd/node/attestation|internal/(buildverify/sandbox|coderun/coderun|distill/isolator))\.go$
        linters: [gosec]
        text: G(204|702)
      # G122: the walk is over a tree safeExtractTar wrote into a fresh private directory,
      # which never creates a symlink, and non-regular entries are skipped.
      - path: ^internal/outputverify/artifact\.go$
        linters: [gosec]
        text: G122
      # G301/G302/G304: operator-configured paths (cache files, model directories, key
      # files) and attest's tar extraction, which confines every entry to its destination.
      - path: ^(cmd/(cachenode|embednode|node)/client|internal/(attest/attest|buildverify/class|nativepush/nativepush|outputverify/artifact|tare/kompress/(model|tokenizer)))\.go$
        linters: [gosec]
        text: G30[124]
      # G404: retry jitter and a fixed-seed negotiation gym, where predictability is harmless
      # (the gym is seeded on purpose so a playbook scores the same every time).
      - path: ^internal/(economy/(agent_subbudget|negotiation_playbooks)|retry/(policy|retry))\.go$
        linters: [gosec]
        text: G404
      # G602: every index is guarded by the len(args) case that dispatches to it.
      - path: ^cmd/lens/tax_cli\.go$
        linters: [gosec]
        text: G602
      # G703: the Tare model directory is operator configuration, and the tax-rates file is
      # the operator's own command-line argument.
      - path: ^cmd/lens/(main|tax_cli)\.go$
        linters: [gosec]
        text: G703
      # G704: requests go to configured upstreams (providers, nodes, control plane); the
      # agent key-directory fetch takes only an https origin and uses safehttp's client.
      - path: ^(cmd/(cachenode/client|embednode/(backend|client)|node/(client|providers))|internal/(agentsig/agentsig|proxy/stream))\.go$
        linters: [gosec]
        text: G704
      # G705: the writes are text/plain, JSON, Markdown and text/event-stream bodies (each
      # already carries its nosemgrep reason), never HTML built from request input; and
      # statement_xlsx.go's one write, a statement PDF or Excel workbook Lens rendered,
      # sent as an attachment with its own content type (B61.132).
      - path: ^(cmd/lens/(chat_listing|compliance_handler|main|statement_xlsx)|internal/proxy/(proxy|stream|web_search))\.go$
        linters: [gosec]
        text: G705
      # G710: the redirect's host is the configured TLS domain; only the path is the request's.
      - path: ^cmd/lens/serve\.go$
        linters: [gosec]
        text: G710

# Formatting gate. This block is the reason 37 files were able to drift
# unformatted behind a green `golangci-lint run` (swept in #360): golangci-lint
# v2 moved formatters OUT of `linters:` into this separate top-level key, so a
# config without it checks formatting not at all. `run` reports these as issues
# and exits nonzero, so no workflow change is needed — the existing
# `golangci-lint run ./...` CI step enforces it.
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      # simplify DEFAULTS TO TRUE, which applies `gofmt -s` rewrites (e.g.
      # s[1:len(s)] -> s[1:]) that plain `gofmt` does NOT. Pinned false so the
      # gate means exactly "is this `gofmt -w` output?" — the same thing every
      # editor's format-on-save produces, so the obvious local fix always
      # satisfies CI. staticcheck (enabled above) already covers the
      # substantive -s simplifications as real findings.
      #
      # The tree satisfies BOTH settings today (`gofmt -s -l .` is also empty),
      # so flipping this to true later is a one-word, zero-churn change.
      simplify: false

issues:
  # gofmt emits one identically-worded issue per file, and max-same-issues
  # DEFAULTS TO 3: on the pre-sweep tree the gate correctly exited 1 but printed
  # only 3 of the 37 files. A developer fixes three, re-runs, and gets three
  # more with no hint that 34 remain. Report the whole set.
  max-same-issues: 0
  # Likewise: the default of 50 per linter would silently truncate a larger
  # drift. No silent caps on a gate whose job is to be exhaustive.
  max-issues-per-linter: 0
